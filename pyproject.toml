[build-system]
    build-backend = "poetry.core.masonry.api"
    requires = [
        "poetry-core>=1.9.0",
    ]

[project]
    classifiers = [
        "Development Status :: 5 - Production/Stable",
        "Intended Audience :: Developers",
        "License :: OSI Approved :: MIT License",
        "Operating System :: OS Independent",
        "Programming Language :: Python :: 3 :: Only",
        "Programming Language :: Python :: 3.13",
        "Topic :: Database",
        "Topic :: Office/Business",
        "Topic :: Software Development :: Libraries :: Python Modules",
        "Topic :: System :: Systems Administration",
        "Typing :: Typed",
    ]
    dependencies = [
        "flext-core>=0.8.0",
        "flext-db-oracle>=0.9.0",
        "flext-meltano>=0.9.0",
        "flext-observability>=0.9.0",
        "pydantic (>=2.12.3)",
        "fastapi (>=0.119.0)",
        "singer-sdk (>=0.52.0)",
        "setuptools (>=80.9.0)",
        "prometheus-client (>=0.23.0)",
        "uvicorn (>=0.38.0)",
        "pydantic-core (>=2.41.4)",
    ]
    description = "FLEXT Tap Oracle - Modern Singer Tap for Oracle Database"
    keywords = [
        "database",
        "enterprise",
        "etl",
        "flext",
        "integration",
        "oracle",
        "singer",
        "tap",
    ]
    name = "flext-tap-oracle"
    readme = "README.md"
    requires-python = ">=3.13,<3.14"
    version = "0.9.0"
    [[project.authors]]
        email = "team@flext.sh"
        name  = "FLEXT Team"

    [[project.maintainers]]
        email = "team@flext.sh"
        name  = "FLEXT Team"

    [project.license]
        text = "MIT"

    [project.urls]
        Documentation = "https://github.com/flext-sh/flext/blob/main/README.md"
        Homepage      = "https://github.com/flext-sh/flext"
        Repository    = "https://github.com/flext-sh/flext"

    [project.scripts]
        flext-tap-oracle = "flext_tap_oracle.tap:cli"
        tap-oracle       = "flext_tap_oracle.tap:cli"

[tool.deptry]
    known_first_party = [
        "flext_tap_oracle",
        "flext_core",
        "flext_meltano",
        "flext_observability",
        "flext_db_oracle",
    ]
    pep621_dev_dependency_groups = [
        "dev",
        "test",
        "typings",
        "security",
    ]

[tool.deptry.per_rule_ignores]
    DEP002 = [
        # CLI tools (invoked from command line, not imported)
        "bandit",
        "black",
        "commitizen",
        "detect-secrets",
        "mkdocs",
        "mkdocs-material",
        "mkdocs-mermaid2-plugin",
        "pip-audit",
        "pre-commit",
        "pyrefly",
        "radon",
        "ruff",
        "vulture",
        # Type stubs
        "scipy-stubs",
        "types-jsonschema",
        "types-openpyxl",
        "types-xlrd",
        # Runtime deps used indirectly (via singer-sdk, pydantic)
        "fastapi",
        "prometheus-client",
        "pydantic-core",
        "pytest",
        "pytest-benchmark",
        "pytest-clarity",
        "pytest-cov",
        "pytest-mock",
        "pytest-randomly",
        "pytest-sugar",
        "pytest-timeout",
        "pytest-xdist",
        "setuptools",
        "singer-sdk",
        "uvicorn",
    ]

[tool.ruff]
    extend = "../ruff-shared.toml"

[tool.poetry.dependencies]
    pydantic = ">=2.12.3"
    python   = ">=3.13,<3.14"

[tool.pytest.ini_options]
    addopts = [
        "--maxfail=1",
        "--strict-config",
        "--strict-markers",
        "--tb=short",
        "-ra",
    ]
    markers = [
        "cli: CLI tests",
        "discovery: marks tests as entity discovery tests",
        "e2e: End-to-end tests",
        "error_handling: Error handling tests",
        "integration: Integration tests",
        "memory: Memory efficiency tests",
        "oracle: marks tests as Oracle database tests",
        "performance: Performance tests",
        "requires_oracle: tests that need Oracle database access",
        "singer: marks tests as Singer protocol tests",
        "slow: Slow tests",
        "smoke: Smoke tests",
        "stream: marks tests as stream tests",
        "stress: Stress tests",
        "tap: marks tests as tap tests",
        "unit: Unit tests",
    ]
    minversion = "8.0"

    [tool.ruff.lint.isort]
        known-first-party = [
            "flext_tap_oracle",
        ]

    [tool.poetry.dependencies.flext-core]
        develop = true
        path    = "../flext-core"

                                                                [tool.poetry.dependencies.flext-meltano]
        develop = true
        path    = "../flext-meltano"

                                                                                                                            [tool.poetry.dependencies.flext-observability]
        develop = true
        path    = "../flext-observability"

                                                                                                                                                                                        [tool.poetry.dependencies.flext-db-oracle]
        develop = true
        path    = "../flext-db-oracle"

[tool.poetry.group.dev.dependencies]
    bandit                 = ">=1.8.0"
    black                  = ">=25.1.0"
    commitizen             = "^4.8.3"
    detect-secrets         = ">=1.5.0"
    mkdocs                 = ">=1.6.0"
    mkdocs-material        = ">=9.5.0"
    mkdocs-mermaid2-plugin = ">=1.1.0"
    pip-audit              = ">=2.9.0"
    pre-commit             = ">=4.0.0"
    pyrefly                = "^0.46.3"
    pytest                 = "^9.0.2"
    pytest-benchmark       = ">=4.0.0"
    pytest-clarity         = ">=1.0.1"
    pytest-cov = "^7.0.0"
    pytest-mock            = ">=3.12.0"
    pytest-sugar           = ">=1.0.0"
    pytest-timeout         = ">=2.3.1"
    pytest-xdist           = ">=3.6.0"
    radon                  = ">=6.0.1"
    ruff                   = ">=0.12.3"
    vulture                = ">=2.14"
opentelemetry-api = ">=1.39.1"
opentelemetry-sdk = ">=1.39.1"
prompt-toolkit = ">=3.0.52"
sqlparse = ">=0.5.5"
pytest-randomly = "^4.0.1"
opentelemetry-exporter-prometheus = ">=0.60b1"
    [tool.poetry.group.typings.dependencies]
    scipy-stubs = "^1.16.2.4"
    types-jsonschema = "^4.25.1.20251009"
    types-openpyxl = "^3.1.5.20250919"
    types-xlrd = "^2.0.0.20251020"

